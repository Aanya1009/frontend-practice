<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1><u>Student Registration Form</u></h1>
    <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required><br><br>
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required><br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="15" max="65"><br><br>

        <label for="gender">Gender:</label>
        
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        
        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>
        <br><br>

        <!-- course selection -->
         <label for="course">Course:</label>
         <select id="course" name="course">
            <option value="">Select a course</option>
            <option value="B.Tech">B.Tech</option>
            <option value="M.Tech">M.Tech</option>
            <option value="B.Sc">B.Sc</option>
            <option value="M.Sc">M.Sc</option>
            <option value="BBA">BBA</option>
            <option value="MBA">MBA</option>
         </select><br><br>

         <!-- Hobbies -->
         <label for="hobbies">Hobbies:</label><br><br>

         <label for="reading">Reading</label>
         <input type="checkbox" name="hobbies" id="reading" value="Reading">

         <label for="dancing">Dancing</label>
         <input type="checkbox" name="hobbies" id="dancing" value="Dancing">

         <label for="singing">Singing</label>
         <input type="checkbox" name="hobbies" id="singing" value="Singing">

        <label for="traveling">Traveling</label>
        <input type="checkbox" name="hobbies" id="traveling" value="Traveling"><br><br>

        <label for="dob">Date Of Birth</label>
        <input type="text" id="dob" name="dob">
        <br><br>

        <label for="address">Address</label>
        <textarea id="address" name="address" rows="4" cols="50"></textarea><br><br>

        <label for="photo">Upload Photo:</label>
        <input type="file" id="photo" name="photo" accept="image/*"><br><br>

        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the terms and conditions</label><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">


    </form>

</body>
</html>
